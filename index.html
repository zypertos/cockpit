        <div class="actions">
          <label class="btn btn-primary">DKB-Export importieren<input class="file-input" type="file" accept=".csv,text/csv,text/comma-separated-values,text/plain" data-change="wealth-import"></label>
          <button type="button" data-action="wealth-tx-add">Buchung erfassen</button>
        </div>
      </header>`;

    if (!pf.depots.length) {
      view.innerHTML = `<div class="page">${head}
        <div class="empty">
          <p class="empty-title">Noch kein Depot angelegt.</p>
          <ul class="empty-list">
            <li>Im DKB-Banking den Depotbestand als CSV exportieren und hier importieren. Ein Export pro Depot.</li>
            <li>Oder über „Buchung erfassen“ ein Depot anlegen und jede Position als Anfangsbestand eintragen.</li>
          </ul>
        </div></div>`;
      return;
    }

    const types = Object.entries(s.byType).sort((a, b) => b[1] - a[1]);
    const top = s.top[0];
    const top3 = s.top.slice(0, 3).reduce((sum, t) => sum + t.pct, 0);
    const cluster = top && top.pct >= CLUSTER_WARN_PCT
      ? `<p class="alloc-note"><strong class="is-warn">Klumpen:</strong> ${esc(top.security.name)} macht ${Num.pct(top.pct)} deines Depotwerts aus. Die drei größten Positionen zusammen ${Num.pct(top3)}.</p>`
      : (top ? `<p class="alloc-note">Größte Position: ${esc(top.security.name)} mit ${Num.pct(top.pct)}. Die drei größten zusammen ${Num.pct(top3)}.</p>` : '');

    view.innerHTML = `
      <div class="page">
        ${head}
        <section class="section">
          <div class="figures">
            <div class="figure"><div class="figure-label">Depotwert</div><div class="figure-value">${esc(fmt.cents(s.valueCents))}</div><div class="figure-sub">${s.open.length} Positionen in ${pf.depots.length} ${pf.depots.length === 1 ? 'Depot' : 'Depots'}</div></div>
            <div class="figure"><div class="figure-label">Einstand</div><div class="figure-value">${esc(fmt.cents(s.costCents))}</div><div class="figure-sub">inklusive erfasster Gebühren</div></div>
            <div class="figure"><div class="figure-label">Kursgewinn</div><div class="figure-value ${Num.cls(s.gainCents)}">${esc(Num.signedCents(s.gainCents))}</div><div class="figure-sub ${Num.cls(s.gainCents)}">${esc(Num.signedPct(s.gainPct))}</div></div>
            <div class="figure"><div class="figure-label">Gebühren ${esc(s.year)}</div><div class="figure-value">${esc(fmt.cents(s.feesYearCents))}</div><div class="figure-sub">${s.terCents ? `dazu ca. ${esc(fmt.cents(s.terCents))} TER im Jahr` : 'TER je Position ergänzen'}</div></div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Aufteilung</h2>
          <div class="alloc-bar" role="img" aria-label="Aufteilung nach Art">${types.map(([t, v]) => `<span style="width:${((v / s.valueCents) * 100).toFixed(2)}%;background:${SECURITY_COLORS[t] || SECURITY_COLORS.other}"></span>`).join('')}</div>
          <div class="alloc-legend">${types.map(([t, v]) => `<span><i style="background:${SECURITY_COLORS[t] || SECURITY_COLORS.other}"></i>${esc(SECURITY_TYPES[t] || t)} ${Num.pct((v / s.valueCents) * 100)}</span>`).join('')}</div>
          ${cluster}
        </section>

        ${pf.depots.map((d) => Wealth.depotTable(d, pf)).join('')}

        <section class="section">
          <p class="note">Konten und dein monatlicher Cashflow mit Gehalt, Fixkosten und Sparrate folgen im nächsten Bauschritt.</p>
        </section>
      </div>`;
  },

  depotTable(depot, pf) {
    const rows = [...pf.positions.values()].filter((p) => p.accountId === depot.id && p.qtyE6 > 0).sort((a, b) => b.valueCents - a.valueCents);
    const value = rows.reduce((sum, p) => sum + p.valueCents, 0);
    const gain = rows.reduce((sum, p) => sum + p.gainCents, 0);
    return `
      <section>
        <div class="depot-head">
          <div><span class="depot-name">${esc(depot.name)}</span> <span class="depot-meta">${esc(fmt.cents(value))}, <span class="${Num.cls(gain)}">${esc(Num.signedCents(gain))}</span></span></div>
          <div class="actions">
            <button type="button" class="btn-small" data-action="wealth-fees" data-account="${esc(depot.id)}">Gebühren</button>
            <button type="button" class="btn-small" data-action="wealth-depot" data-account="${esc(depot.id)}">Bearbeiten</button>
          </div>
        </div>
        ${rows.length ? `
        <div class="table-wrap">
          <table class="ledger-table">
            <thead><tr><th>Wertpapier</th><th>Stück</th><th>Einstand</th><th>Kurs</th><th>Wert</th><th>Gewinn</th></tr></thead>
            <tbody>
              ${rows.map((p) => {
                const sec = pf.securities.get(p.securityId);
                const estimated = p.txs.some((t) => t.estimated);
                return `<tr data-action="wealth-position" data-account="${esc(depot.id)}" data-security="${esc(sec.id)}">
                  <td><div class="sec-name">${esc(sec.name)} ${estimated ? '<span class="tag">geschätzt</span>' : ''}</div><div class="sec-meta">${esc(SECURITY_TYPES[sec.securityType] || '')}, ${esc(sec.isin)}</div></td>
                  <td>${esc(Num.qty(p.qtyE6))}</td>
                  <td>${esc(Num.priceShort(p.avgE4))}</td>
                  <td>${esc(Num.priceShort(p.priceE4))}</td>
                  <td>${esc(fmt.cents(p.valueCents))}</td>
                  <td><span class="${Num.cls(p.gainCents)}">${esc(Num.signedCents(p.gainCents))}</span><div class="sec-meta ${Num.cls(p.gainCents)}">${esc(Num.signedPct(p.gainPct))}</div></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>` : '<p class="note">In diesem Depot ist zurzeit nichts im Bestand.</p>'}
      </section>`;
  },

  // ----- Position ansehen und korrigieren ---------------------------------------
  async position(accountId, securityId) {
    const pf = await Portfolio.load();
    const p = pf.positions.get(`${accountId}|${securityId}`);
    const sec = pf.securities.get(securityId);
    if (!p || !sec) return;
    const opt = (value, label, current) => `<option value="${esc(value)}" ${value === current ? 'selected' : ''}>${esc(label)}</option>`;
    const txRows = p.txs.slice().reverse().map((t) => `
      <tr>
        <td>${esc(fmt.date(t.tradeDate))}<div class="sec-meta">${esc(TX_TYPES[t.txType] || t.txType)} ${t.estimated ? '<span class="tag">geschätzt</span>' : ''}</div></td>
        <td>${t.txType === 'distribution' ? esc(fmt.cents(t.amountCents || 0)) : esc(Num.qty(t.quantityE6))}</td>
        <td>${t.txType === 'distribution' ? '' : `<input name="price_${esc(t.id)}" inputmode="decimal" value="${esc(Num.input(t.priceE4, 4))}" aria-label="Kurs">`}</td>
        <td><input name="fee_${esc(t.id)}" inputmode="decimal" value="${esc(Num.input(t.feesCents || 0, 2))}" aria-label="Gebühren"></td>
        <td><label class="check" style="justify-content:flex-end"><input type="checkbox" name="del_${esc(t.id)}" aria-label="Buchung löschen"></label></td>
      </tr>`).join('');

    const result = await UI.form({
      title: sec.name,
      wide: true,
      submitLabel: 'Speichern',
      html: `
        <dl class="facts">
          <div><dt>Stück</dt><dd>${esc(Num.qty(p.qtyE6))}</dd></div>
          <div><dt>Einstand je Stück</dt><dd>${esc(Num.price(p.avgE4))}</dd></div>
          <div><dt>Kurs${p.priceDate ? ` vom ${esc(fmt.date(p.priceDate))}` : ''}</dt><dd>${esc(Num.price(p.priceE4))}</dd></div>
          <div><dt>Wert</dt><dd>${esc(fmt.cents(p.valueCents))}</dd></div>
          <div><dt>Kursgewinn</dt><dd class="${Num.cls(p.gainCents)}">${esc(Num.signedCents(p.gainCents))}</dd></div>
          <div><dt>Gebühren gesamt</dt><dd>${esc(fmt.cents(p.feesCents))}</dd></div>
        </dl>
        <div class="field-grid">
          <div class="field span-2"><label for="ps-name">Bezeichnung</label><input id="ps-name" name="name" value="${esc(sec.name)}"></div>
          <div class="field"><label for="ps-type">Art</label><select id="ps-type" name="securityType">${Object.entries(SECURITY_TYPES).map(([v, l]) => opt(v, l, sec.securityType)).join('')}</select></div>
          <div class="field"><label for="ps-ter">TER in % pro Jahr</label><input id="ps-ter" name="ter" inputmode="decimal" placeholder="z. B. 0,25" value="${sec.ter != null ? esc(String(sec.ter).replace('.', ',')) : ''}"></div>
          <div class="field span-2"><label for="ps-fund">Fondsart (für die Teilfreistellung)</label><select id="ps-fund" name="fundTaxClass"><option value="">Nicht festgelegt</option>${Object.entries(FUND_TAX_CLASSES).map(([v, l]) => opt(v, l, sec.fundTaxClass)).join('')}</select></div>
        </div>
        <h3 class="section-title" style="margin:0.5rem 0 0">Buchungen</h3>
        <div class="table-wrap">
          <table class="ledger-table tx-table">
            <thead><tr><th>Datum</th><th>Stück</th><th>Kurs</th><th>Gebühren</th><th>Löschen</th></tr></thead>
            <tbody>${txRows}</tbody>
          </table>
        </div>
        <p class="dialog-text">Kurs und Gebühren lassen sich direkt korrigieren, zum Beispiel aus der Wertpapierabrechnung. Korrigierte Buchungen gelten nicht mehr als geschätzt.</p>`,
      validate: (d) => {
        if (d.ter && Num.parse(d.ter, 4) == null) return 'Die TER bitte als Zahl eingeben, zum Beispiel 0,25.';
        for (const t of p.txs) {
          if (d[`price_${t.id}`] !== undefined && !d[`del_${t.id}`] && !(Num.parse(d[`price_${t.id}`], 4) > 0)) return `Der Kurs vom ${fmt.date(t.tradeDate)} ist nicht lesbar.`;
          if (Num.parse(d[`fee_${t.id}`] || '0', 2) == null) return `Die Gebühr vom ${fmt.date(t.tradeDate)} ist nicht lesbar.`;
        }
        return null;
      },
    });
    if (!result) return;

    const ter = result.ter ? Num.parse(result.ter, 4) / 10000 : null;
    await DB.write(['securities', 'investmentTransactions'], (s) => {
      s.securities.put({ ...sec, name: result.name.trim() || sec.name, securityType: result.securityType, ter, fundTaxClass: result.fundTaxClass || null, updatedAt: nowIso() });
      for (const t of p.txs) {
        if (result[`del_${t.id}`]) { s.investmentTransactions.delete(t.id); continue; }
        const priceE4 = t.txType === 'distribution' ? t.priceE4 : Num.parse(result[`price_${t.id}`], 4);
        const feesCents = Num.parse(result[`fee_${t.id}`] || '0', 2);
        if (priceE4 !== t.priceE4 || feesCents !== (t.feesCents || 0)) {
          s.investmentTransactions.put({ ...t, priceE4, feesCents, estimated: false, updatedAt: nowIso() });
        }
      }
    });
    UI.toast('Gespeichert');
    App.render();
  },

  // ----- Buchung erfassen ---------------------------------------------------------
  async addTransaction() {
    const pf = await Portfolio.load();
    const secs = [...pf.securities.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
    let prepared = null;

    const result = await UI.form({
      title: 'Buchung erfassen',
      wide: true,
      submitLabel: 'Buchen',
      html: `
        <div class="field-grid">
          <div class="field"><label for="tx-account">Depot</label>
            <select id="tx-account" name="account">${pf.depots.map((d) => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}<option value="__new">Neues Depot anlegen …</option></select></div>
          <div class="field" data-show="new-depot"><label for="tx-newdepot">Name des neuen Depots</label><input id="tx-newdepot" name="newDepot" placeholder="z. B. DKB-Depot"></div>
          <div class="field span-2"><label for="tx-security">Wertpapier</label>
            <select id="tx-security" name="security">${secs.map((s) => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.isin)})</option>`).join('')}<option value="__new">Neues Wertpapier …</option></select></div>
          <div class="field" data-show="new-security"><label for="tx-isin">ISIN</label><input id="tx-isin" name="isin" autocapitalize="characters" autocomplete="off" placeholder="z. B. IE00B4L5Y983"></div>
          <div class="field" data-show="new-security"><label for="tx-sectype">Art</label><select id="tx-sectype" name="securityType">${Object.entries(SECURITY_TYPES).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select></div>
          <div class="field span-2" data-show="new-security"><label for="tx-secname">Bezeichnung</label><input id="tx-secname" name="secName"></div>
          <div class="field"><label for="tx-type">Art der Buchung</label>
            <select id="tx-type" name="txType">${Object.entries(TX_TYPES).map(([v, l]) => `<option value="${v}" ${v === 'buy' ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
          <div class="field"><label for="tx-date">Datum</label><input id="tx-date" name="date" type="date" value="${todayIso()}"></div>
          <div class="field" data-show="units"><label for="tx-qty">Stück</label><input id="tx-qty" name="qty" inputmode="decimal" placeholder="z. B. 12,5"></div>
          <div class="field" data-show="units"><label for="tx-price">Kurs je Stück in €</label><input id="tx-price" name="price" inputmode="decimal" placeholder="z. B. 98,45"></div>
          <div class="field" data-show="amount"><label for="tx-amount">Betrag in €</label><input id="tx-amount" name="amount" inputmode="decimal"></div>
          <div class="field"><label for="tx-fee">Gebühren in €</label><input id="tx-fee" name="fee" inputmode="decimal" value="0,00"></div>
          <div class="field" data-show="taxes"><label for="tx-tax">Abgeführte Steuern in €</label><input id="tx-tax" name="tax" inputmode="decimal" value="0,00"></div>
        </div>
        <p class="dialog-text" id="tx-fee-hint"></p>`,
      onOpen: (form) => {
        const feeInput = form.elements.fee;
        const update = () => {
          const newDepot = form.elements.account.value === '__new';
          const newSec = form.elements.security.value === '__new';
          const type = form.elements.txType.value;
          $$('[data-show="new-depot"]', form).forEach((el) => { el.hidden = !newDepot; });
          $$('[data-show="new-security"]', form).forEach((el) => { el.hidden = !newSec; });
          $$('[data-show="units"]', form).forEach((el) => { el.hidden = type === 'distribution'; });
          $$('[data-show="amount"]', form).forEach((el) => { el.hidden = type !== 'distribution'; });
          $$('[data-show="taxes"]', form).forEach((el) => { el.hidden = !['sell', 'distribution'].includes(type); });
          // Gebühr nach Preismodell vorschlagen, solange sie nicht selbst geändert wurde
          const account = pf.depots.find((d) => d.id === form.elements.account.value);
          const qty = Num.parse(form.elements.qty.value, 6);
          const price = Num.parse(form.elements.price.value, 4);
          const hint = $('#tx-fee-hint', form);
          if (account && account.feeRules?.length && qty && price && type !== 'opening' && type !== 'distribution') {
            const fee = Portfolio.feeFor(account, type, Num.valueCents(qty, price));
            if (!feeInput.dataset.touched) feeInput.value = Num.input(fee, 2);
            hint.textContent = `Laut Preismodell von „${account.name}“: ${fmt.cents(fee)}.`;
          } else {
            hint.textContent = account && !account.feeRules?.length ? 'Tipp: Unter „Gebühren“ am Depot kannst du das Preismodell hinterlegen. Dann schlägt die App die Gebühr vor.' : '';
          }
        };
        feeInput.addEventListener('input', () => { feeInput.dataset.touched = '1'; });
        form.addEventListener('input', update);
        form.addEventListener('change', update);
        if (!pf.depots.length) form.elements.account.value = '__new';
        if (!secs.length) form.elements.security.value = '__new';
        update();
      },
      validate: (d) => {
        if (d.account === '__new' && !(d.newDepot || '').trim()) return 'Bitte einen Namen für das neue Depot eingeben.';
        const isin = (d.isin || '').trim().toUpperCase();
        if (d.security === '__new') {
          if (!/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(isin)) return 'Die ISIN hat 12 Zeichen, zum Beispiel IE00B4L5Y983.';
          if (secs.some((s) => s.isin === isin)) return 'Dieses Wertpapier gibt es schon. Bitte in der Liste auswählen.';
          if (!(d.secName || '').trim()) return 'Bitte eine Bezeichnung für das Wertpapier eingeben.';
        }
        if (!d.date) return 'Bitte ein Datum wählen.';
        const fees = Num.parse(d.fee || '0', 2);
        const taxes = Num.parse(d.tax || '0', 2);
        if (fees == null || fees < 0) return 'Die Gebühr ist nicht lesbar.';
        if (taxes == null || taxes < 0) return 'Die Steuer ist nicht lesbar.';
        const tx = { txType: d.txType, tradeDate: d.date, feesCents: fees, taxesCents: ['sell', 'distribution'].includes(d.txType) ? taxes : 0 };
        if (d.txType === 'distribution') {
          const amount = Num.parse(d.amount, 2);
          if (!(amount > 0)) return 'Bitte den ausgeschütteten Betrag eingeben.';
          Object.assign(tx, { amountCents: amount, quantityE6: 0, priceE4: 0 });
        } else {
          const qty = Num.parse(d.qty, 6);
          const price = Num.parse(d.price, 4);
          if (!(qty > 0)) return 'Bitte die Stückzahl eingeben.';
          if (!(price > 0)) return 'Bitte den Kurs je Stück eingeben.';
          if (d.txType === 'sell' && d.security !== '__new') {
            const held = pf.positions.get(`${d.account}|${d.security}`)?.qtyE6 || 0;
            if (qty > held) return `Im Depot sind nur ${Num.qty(held)} Stück vorhanden.`;
          }
          Object.assign(tx, { quantityE6: qty, priceE4: price });
        }
        prepared = { d, isin, tx };
        return null;
      },
    });
    if (!result || !prepared) return;

    const { d, isin, tx } = prepared;
    const now = nowIso();
    const accountId = d.account === '__new' ? crypto.randomUUID() : d.account;
    const securityId = d.security === '__new' ? crypto.randomUUID() : d.security;
    await DB.write(['accounts', 'securities', 'investmentTransactions'], (s) => {
      if (d.account === '__new') s.accounts.put({ id: accountId, name: d.newDepot.trim(), institution: '', accountType: 'depot', depotNumber: null, feeRules: [], createdAt: now, updatedAt: now });
      if (d.security === '__new') s.securities.put({ id: securityId, isin, wkn: '', name: d.secName.trim(), securityType: d.securityType, ter: null, fundTaxClass: null, priceSymbol: null, exposures: [], createdAt: now, updatedAt: now });
      s.investmentTransactions.put({ id: crypto.randomUUID(), accountId, securityId, ...tx, estimated: false, source: 'manual', createdAt: now });
    });
    UI.toast('Gebucht');
    App.render();
  },

  // ----- Preismodell des Depots -----------------------------------------------------
  async fees(accountId) {
    const account = await DB.get('accounts', accountId);
    const rule = (type) => (account.feeRules || []).find((r) => r.txType === type) || {};
    const money = (c) => (c ? Num.input(c, 2) : '');
    const labels = { buy: 'Kauf', savings_plan: 'Sparplan', sell: 'Verkauf' };
    const result = await UI.form({
      title: `Gebühren: ${account.name}`,
      wide: true,
      submitLabel: 'Speichern',
      html: `
        <p class="dialog-text">Trag das Preismodell deines Depots ein. Die Gebühr ergibt sich aus Fixbetrag plus Prozentsatz vom Ordervolumen, begrenzt durch Minimum und Maximum. Leere Felder zählen als 0.</p>
        <div class="table-wrap">
          <table class="ledger-table tx-table">
            <thead><tr><th>Art</th><th>Fix in €</th><th>Prozent</th><th>Minimum €</th><th>Maximum €</th></tr></thead>
            <tbody>${FEE_RULE_TYPES.map((t) => {
              const r = rule(t);
              return `<tr><td>${labels[t]}</td>
                <td><input name="fixed_${t}" inputmode="decimal" value="${esc(money(r.fixedCents))}" aria-label="Fix ${labels[t]}"></td>
                <td><input name="pct_${t}" inputmode="decimal" value="${r.pct ? esc(String(r.pct).replace('.', ',')) : ''}" aria-label="Prozent ${labels[t]}"></td>
                <td><input name="min_${t}" inputmode="decimal" value="${esc(money(r.minCents))}" aria-label="Minimum ${labels[t]}"></td>
                <td><input name="max_${t}" inputmode="decimal" value="${esc(money(r.maxCents))}" aria-label="Maximum ${labels[t]}"></td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>`,
      validate: (d) => {
        for (const t of FEE_RULE_TYPES) for (const f of ['fixed', 'pct', 'min', 'max']) {
          if (d[`${f}_${t}`] && Num.parse(d[`${f}_${t}`], 4) == null) return `Bei ${labels[t]} ist ein Wert nicht lesbar.`;
        }
        return null;
      },
    });
    if (!result) return;
    const cents = (v) => (v ? Num.parse(v, 2) : 0);
    const feeRules = FEE_RULE_TYPES.map((t) => ({
      txType: t, fixedCents: cents(result[`fixed_${t}`]), pct: result[`pct_${t}`] ? Num.parse(result[`pct_${t}`], 4) / 10000 : 0,
      minCents: cents(result[`min_${t}`]), maxCents: cents(result[`max_${t}`]),
    })).filter((r) => r.fixedCents || r.pct || r.minCents || r.maxCents);
    await DB.put('accounts', { ...account, feeRules, updatedAt: nowIso() });
    UI.toast('Preismodell gespeichert');
    App.render();
  },

  // ----- Depot umbenennen oder löschen -----------------------------------------------
  async editDepot(accountId) {
    const account = await DB.get('accounts', accountId);
    const result = await UI.form({
      title: 'Depot bearbeiten',
      submitLabel: 'Speichern',
      html: `
        <div class="field"><label for="dp-name">Name</label><input id="dp-name" name="name" value="${esc(account.name)}"></div>
        <label class="check"><input type="checkbox" name="remove"> Depot mit allen Buchungen löschen</label>`,
      validate: (d) => (!d.remove && !(d.name || '').trim() ? 'Bitte einen Namen eingeben.' : null),
    });
    if (!result) return;
    if (result.remove) {
      const ok = await UI.confirm({ title: `„${account.name}“ löschen?`, text: 'Alle Buchungen dieses Depots werden gelöscht. Wertpapiere und Kurse bleiben für andere Depots erhalten.', confirmLabel: 'Löschen', danger: true });
      if (!ok) return;
      const txs = await DB.byIndex('investmentTransactions', 'accountId', accountId);
      await DB.write(['accounts', 'investmentTransactions'], (s) => {
        s.accounts.delete(accountId);
        txs.forEach((t) => s.investmentTransactions.delete(t.id));
      });
      UI.toast('Depot gelöscht');
    } else {
      await DB.put('accounts', { ...account, name: result.name.trim(), updatedAt: nowIso() });
      UI.toast('Gespeichert');
    }
    App.render();
  },
};

const MODULES = [
  { id: 'start', title: 'Übersicht', icon: 'overview', render: Pages.start },
  {
    id: 'vermoegen', title: 'Vermögen', icon: 'wealth',
    summary: 'ETFs, Aktien und Konten, Gehalt, Fixkosten und Sparrate',
    state: (ctx) => (ctx.depotValue != null ? `Depots ${fmt.cents(ctx.depotValue)}` : 'Bereit für den Import'),
    render: (view) => Wealth.render(view),
  },
  {
    id: 'immobilien', title: 'Immobilien', icon: 'property',
    summary: 'Objekte, Kredite, Mieten, AfA, Rendite und Cashflow',
    render: Pages.placeholder('Jede Immobilie mit Kauf, Finanzierung, Miete und Kosten.', [
      'Kaufpreis, Nebenkosten, Eigenkapital und Kredite je Objekt',
      'Mietrendite, Cashflow vor und nach Steuern, Beleihungsauslauf',
      'AfA nach Fertigstellungsjahr und Bodenanteil',
    ]),
  },
  {
    id: 'simulation', title: 'Objekt-Rechner', icon: 'scenario',
    summary: 'Neue Objekte durchrechnen, Schmerzgrenze und Break-even',
    render: Pages.placeholder('Ein Angebot prüfen, bevor du kaufst.', [
      'Kaufpreis, erwartete Miete, Renovierung und Zins eingeben',
      'Wirkung auf deinen Gesamt-Cashflow nach Steuern, sofort berechnet',
      'Höchster sinnvoller Kaufpreis und Break-even mit Mietsteigerung',
    ]),
  },
  {
    id: 'steuer', title: 'Steuer & Belege', icon: 'tax',
    summary: 'Belege, Steuer-Tabelle und EÜR für die Anlage V',
    render: Pages.placeholder('Belege sammeln und das Steuerjahr je Objekt abschließen.', [
      'Belege mit der Kamera fotografieren oder als PDF ablegen',
      'Steuer-Tabelle mit Datum, Kategorie, Betrag und Beleg',
      'Einnahmen-Überschuss-Rechnung je Objekt als Vorlage für die Anlage V',
    ]),
  },
  {
    id: 'ki', title: 'KI-Beratung', icon: 'ai',
    summary: 'Portfolio-Analyse und Vorschläge von Claude',
    state: (ctx) => (ctx.hasKey ? 'Schlüssel hinterlegt' : 'Schlüssel fehlt'),
    render: Pages.placeholder('Claude analysiert deine Zahlen und schlägt nächste Schritte vor.', [
      'Kennzahlen ohne Namen und Adressen an Claude senden',
      'Klumpenrisiken erkennen und Optionen abwägen: ETF oder nächste Immobilie',
      'Frühere Analysen und Rückfragen im Verlauf',

  { id: 'einstellungen', title: 'Einstellungen', icon: 'settings', render: Pages.settings, footer: true },

/* =============================================================================
   9. APP: Navigation, Aktionen, Start
   ============================================================================= */
const App = {
  autoLockMinutes: 5,

  async enter() {
    $('#lock').hidden = true;
    $('#lock').innerHTML = '';
    $('#app').hidden = false;
    App.autoLockMinutes = await Settings.get('autoLockMinutes', 5);
    Lock.lastActivity = Date.now();
    Lock.watch();
    await App.renderNav();
    await App.render();
    // Bitte ans iPad: Daten dieser App nicht automatisch aufräumen
    try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (_) { /* optional */ }
  },

  currentModule() {
    const id = (location.hash || '#start').slice(1);
    return MODULES.find((m) => m.id === id) || MODULES[0];
  },

  async renderNav() {
    const [last, days] = await Promise.all([Settings.get('lastBackupAt'), Settings.get('backupReminderDays', 14)]);
    const overdue = Backup.status(last, days).level !== 'ok';
    const item = (m) => `
      <li><a href="#${m.id}" data-nav="${m.id}">
        ${icon(m.icon)}<span class="nav-label">${esc(m.title)}</span>
        ${m.id === 'einstellungen' && overdue ? '<span class="dot" title="Sicherung fällig"></span>' : ''}
      </a></li>`;
    $('#nav-main').innerHTML = MODULES.filter((m) => !m.footer).map(item).join('');
    $('#nav-foot').innerHTML = MODULES.filter((m) => m.footer).map(item).join('')
      + `<li><button type="button" data-action="lock-now">${icon('lock')}<span class="nav-label">Sperren</span></button></li>`;
    App.markNav();
  },

  markNav() {
    const current = App.currentModule().id;
    $$('[data-nav]').forEach((a) => {
      if (a.dataset.nav === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  },

  async render() {
    if (!Vault.key) return;
    const module = App.currentModule();
    const view = $('#view');
    App.markNav();
    document.title = `${module.title} – Finanz-Cockpit`;
    try {
      await module.render(view, module);
    } catch (err) {
      console.error(err);
      view.innerHTML = `<div class="page"><h1 class="page-title">Fehler</h1><p class="page-sub">Dieser Bereich ließ sich nicht laden: ${esc(err.message)}</p></div>`;
    }
    view.scrollTop = 0;
  },

  async wipe() {
    UI.busy('Daten werden gelöscht …');
    try { await DB.destroy(); } catch (err) { console.error(err); }
    location.hash = '';
    location.reload();
  },

  // ----- Aktionen (per data-action an Knöpfen) --------------------------------
  actions: {
    'lock-kind': (el) => Lock.setKind(el.dataset.kind),
    'lock-forgot': () => Lock.forgot(),
    'lock-now': () => Lock.lock(),

    async 'lock-change'() {
      const current = await Settings.get('appLock');
      const curName = Lock.labels(current.kind || 'pin').name;
      const result = await UI.form({
        title: `${curName} ändern`,
        html: `
          <div class="field"><label for="lc-old">Aktuelle ${esc(curName)}</label><input id="lc-old" name="old" type="password" inputmode="${current.kind === 'password' ? 'text' : 'numeric'}" autocomplete="current-password"></div>
          <div class="field"><label for="lc-kind">Neue Art</label><select id="lc-kind" name="kind"><option value="pin" ${current.kind !== 'password' ? 'selected' : ''}>PIN, mindestens 6 Ziffern</option><option value="password" ${current.kind === 'password' ? 'selected' : ''}>Passwort, mindestens 8 Zeichen</option></select></div>
          <div class="field"><label for="lc-new1">Neu</label><input id="lc-new1" name="new1" type="password" autocomplete="new-password"></div>
          <div class="field"><label for="lc-new2">Neu wiederholen</label><input id="lc-new2" name="new2" type="password" autocomplete="new-password"></div>`,
        submitLabel: 'Ändern',
        validate: async (d) => {
          const error = Lock.validateSecret(d.kind, d.new1 || '') || (d.new1 !== d.new2 ? 'Die neuen Eingaben stimmen nicht überein.' : null);
          if (error) return error;
          try {
            const dataKey = await Vault.unwrapDataKey(d.old || '', current, true);
            const record = await Vault.wrapDataKey(dataKey, d.new1);
            record.kind = d.kind;
            await Settings.set('appLock', record);
            Lock.kind = d.kind;
            return null;
          } catch (_) {
            return `Die aktuelle ${curName} stimmt nicht.`;
          }
        },
      });
      if (result) { UI.toast('Geändert'); App.render(); }
    },

    async 'api-key-remove'() {
      const ok = await UI.confirm({ title: 'API-Schlüssel entfernen?', text: 'Die KI-Beratung funktioniert erst wieder, wenn du einen Schlüssel einträgst.', confirmLabel: 'Entfernen', danger: true });
      if (!ok) return;
      await Settings.remove('anthropicApiKey');
      UI.toast('Schlüssel entfernt');
      App.render();
    },

    async 'api-test'(el) {
      const out = $('#api-test-result');
      el.disabled = true;
      out.className = 'row-hint';
      out.textContent = 'Anfrage läuft …';
      try {
        const result = await Claude.test();
        out.className = 'row-hint is-ok';
        out.textContent = `Verbunden mit ${result.model || 'Claude'}. Antwort: ${result.text.trim() || 'leer'}`;
      } catch (err) {
        out.className = 'row-hint is-neg';
        out.textContent = err.message;
      } finally {
        el.disabled = false;
      }
    },

    'backup-create': () => Backup.create(),

    // Modul Vermögen
    'wealth-tx-add': () => Wealth.addTransaction(),
    'wealth-position': (el) => Wealth.position(el.dataset.account, el.dataset.security),
    'wealth-fees': (el) => Wealth.fees(el.dataset.account),
    'wealth-depot': (el) => Wealth.editDepot(el.dataset.account),

    async 'storage-persist'() {
      let granted = false;
      try { granted = await navigator.storage.persist(); } catch (_) { /* nicht verfügbar */ }
      UI.toast(granted ? 'Dauerhafte Speicherung aktiv' : 'Das iPad hat die Anfrage nicht bestätigt');
      App.render();
    },

    async wipe() {
      const result = await UI.form({
        title: 'Alle Daten löschen?',
        html: '<p class="dialog-text">Datenbank, Belege, PIN und API-Schlüssel werden auf diesem iPad gelöscht. Das lässt sich nur mit einer Sicherung rückgängig machen.</p><div class="field"><label for="wp-confirm">Zur Bestätigung LÖSCHEN eintippen</label><input id="wp-confirm" name="confirm" autocapitalize="characters" autocomplete="off"></div>',
        submitLabel: 'Endgültig löschen',
        danger: true,
        validate: (d) => ((d.confirm || '').trim().toUpperCase() === 'LÖSCHEN' ? null : 'Bitte LÖSCHEN eintippen.'),
      });
      if (result) await App.wipe();
    },
  },

  // ----- Formulare (per data-form) ---------------------------------------------
  forms: {
    'lock-setup': (form) => Lock.submitSetup(form),
    'lock-unlock': (form) => Lock.submitUnlock(form),
    async 'api-key'(form) {
      const key = form.apiKey.value.trim();
      if (!key) { UI.toast('Bitte einen Schlüssel einfügen.', { error: true }); return; }
      if (!key.startsWith('sk-ant-')) {
        const ok = await UI.confirm({ title: 'Ungewöhnlicher Schlüssel', text: 'Claude-API-Schlüssel beginnen normalerweise mit „sk-ant-“. Trotzdem speichern?', confirmLabel: 'Speichern' });
        if (!ok) return;
      }
      await Claude.saveKey(key);
      form.reset();
      UI.toast('Schlüssel verschlüsselt gespeichert');
      App.render();
    },
  },

  bindEvents() {
    document.addEventListener('click', (event) => {
      const el = event.target.closest('[data-action]');
      if (!el || el.disabled) return;
      const action = App.actions[el.dataset.action];
      if (action) { event.preventDefault(); action(el); }
    });

    document.addEventListener('submit', (event) => {
      const form = event.target.closest('[data-form]');
      if (!form) return;
      event.preventDefault();
      App.forms[form.dataset.form]?.(form);
    });

    document.addEventListener('change', async (event) => {
      const el = event.target;
      if (el.matches('[data-setting]')) {
        let value = el.value.trim();
        if (el.dataset.type === 'number') value = Number(value);
        if (el.dataset.setting === 'aiModel' && !value) { value = DEFAULT_MODEL; el.value = value; }
        await Settings.set(el.dataset.setting, value);
        if (el.dataset.setting === 'autoLockMinutes') App.autoLockMinutes = value;
        if (el.dataset.setting === 'backupReminderDays') { App.renderNav(); App.render(); }
        UI.toast('Gespeichert');
      }
      if (el.matches('[data-change="wealth-import"]') && el.files?.[0]) {
        const file = el.files[0];
        el.value = '';
        DepotImport.start(file).catch((err) => { console.error(err); UI.toast('Der Import ist fehlgeschlagen.', { error: true }); });
      }
      if (el.matches('[data-change="backup-restore"]') && el.files?.[0]) {
        const file = el.files[0];
        el.value = '';
        Backup.restore(file);
      }
    });

    window.addEventListener('hashchange', () => App.render());
  },
};

/* =============================================================================
   10. START
   ============================================================================= */
function fail(message) {
  document.body.innerHTML = `<main class="fatal"><h1>Finanz-Cockpit</h1><p>${esc(message)}</p></main>`;
}

async function boot() {
  if (!window.isSecureContext || !window.crypto?.subtle) {
    fail('Die App braucht eine sichere Verbindung. Bitte über die https-Adresse öffnen, nicht als Datei aus der Dateien-App.');
    return;
  }
  if (!window.indexedDB) { fail('Dieser Browser bietet keine lokale Datenbank.'); return; }

  try { await DB.open(); }
  catch (err) { fail(`Die Datenbank ließ sich nicht öffnen: ${err.message}`); return; }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('Offline-Modus nicht verfügbar:', err));
  }

  App.bindEvents();
  await Lock.init();
}

boot();
})();
</script>
